<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti Systems | Vocaloid & Más</title>
    <script type="module" src="/src/general.ts"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
</head>
<body>
    {{>header}}
    <main>
        <div class="flechasNavArtist flex self-end mr-4 gap-2">
            <div class="anterior">
                <button type="button" class="bg-white/5 cursor-pointer rounded-full">
                    <svg class="size-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6" fill="none"/>
                    </svg>
                </button>
            </div>
            <div class="siguiente">
                <button type="button" class="bg-white/5 cursor-pointer rounded-full">
                    <svg class="size-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6" fill="none"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="tablas w-11/12">
            <table class="relative w-full border border-collapse my-12 mx-0">
                <thead>
                    <caption class="p-4 font-sans text-2xl border" colspan="2">
                        <span class="w-max" title="Nombre de la canción">AntiSystem's</span>
                    </caption>
                </thead>
                <tbody>
                    <tr>
                        <td class="border text-center p-4 font-playfair my-0 mx-auto content-start flex flex-col place-items-center">
                            <span class="w-max" title="Voces">Hatsune Miku</span>
                        </td>
                    </tr>
                    <tr>
                        <td class="border text-center p-4 font-playfair my-0 mx-auto content-start flex flex-col place-items-center">
                            <div class="MVdeCancion mt-4 w-full">
                                <iframe class="m-auto aspect-video max-w-xl" src="https://www.youtube.com/embed/e-i2_WHxUBg?si=As6D96fH0hz-wvCk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    {{>footer}}
</body>
</html>
